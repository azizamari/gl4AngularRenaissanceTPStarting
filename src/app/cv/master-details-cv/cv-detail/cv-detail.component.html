@if (cv.isLoading()) {
  <div class="alert alert-info">Chargement du cv...</div>
} @else if (cv.error()) {
  <div class="alert alert-danger">Cv introuvable.</div>
} @else if (cv.value(); as cv) {
  <div class="card">
    <div class="card-body text-center">
      <img
        class="rounded-circle"
        width="150"
        height="150"
        src="assets/images/{{ cv.path | defaultImage }}"
        alt="{{ cv.name }}"
      />
      <h4 class="mt-3">{{ cv.firstname }} {{ cv.name }}</h4>
      <p class="text-muted">{{ cv.job }}</p>
    </div>
    <table class="table table-striped mb-0">
      <tbody>
        <tr>
          <th>Age</th>
          <td>{{ cv.age }}</td>
        </tr>
        <tr>
          <th>Cin</th>
          <td>{{ cv.cin }}</td>
        </tr>
      </tbody>
    </table>
  </div>
}
