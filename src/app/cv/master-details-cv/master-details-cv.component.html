<div class="row">
  <div class="col-md-4">
    @if (cvs.isLoading()) {
      <div class="alert alert-info">Chargement des cvs...</div>
    } @else if (cvs.error()) {
      <div class="alert alert-danger">Impossible de charger les cvs.</div>
    } @else {
      <div class="list-group">
        @for (cv of cvs.value(); track cv.id) {
          <a
            class="list-group-item list-group-item-action d-flex align-items-center gap-2"
            [routerLink]="[cv.id]"
            routerLinkActive="active"
          >
            <img
              class="rounded-circle"
              width="40"
              height="40"
              src="assets/images/{{ cv.path | defaultImage }}"
              alt="{{ cv.name }}"
            />
            {{ cv.firstname }} {{ cv.name }}
          </a>
        }
      </div>
    }
  </div>
  <div class="col-md-8">
    <router-outlet />
  </div>
</div>
