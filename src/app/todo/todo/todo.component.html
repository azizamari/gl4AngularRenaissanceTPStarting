<div class="p-2 bg-info-subtle">
  <div class="row g-2 mb-2">
    <div class="col">
      <input [(ngModel)]="name" class="form-control form-control-sm" placeholder="name" />
    </div>
    <div class="col">
      <input [(ngModel)]="content" class="form-control form-control-sm" placeholder="content" />
    </div>
    <div class="col-auto">
      <button (click)="addTodo()" [disabled]="!canAdd()" class="btn btn-danger btn-sm">add</button>
    </div>
  </div>

  <div class="row g-0">
    @for (column of columns; track column.status) {
      <div class="col">
        <div class="alert alert-{{ column.color }} h-100 mb-0 rounded-0">
          <h5>{{ column.title }}</h5>

          @for (todo of column.todos(); track todo.id) {
            <div class="card mb-2">
              <div class="card-body p-2">
                <strong>{{ todo.name }}</strong> : {{ todo.content }}
                <i (click)="deleteTodo(todo)" class="fa fa-trash float-end" role="button"></i>

                <div class="mt-2">
                  @for (target of columns; track target.status) {
                    @if (target.status !== todo.status) {
                      <button (click)="updateStatus(todo, target.status)"
                        class="btn btn-sm btn-outline-{{ target.color }} me-1">
                        {{ target.status }}
                      </button>
                    }
                  }
                </div>
              </div>
            </div>
          } @empty {
            <small class="text-muted">No todos</small>
          }
        </div>
      </div>
    }
  </div>
</div>
