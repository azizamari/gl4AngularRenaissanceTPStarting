<div class="container mt-4">
  <p class="h5 mb-3">products-filter LinkedSignal Exo!</p>

  <div class="mb-3">
    <input
      class="form-control"
      type="text"
      placeholder="Search products"
      [value]="search()"
      (input)="onSearchChange($event)"
    />
  </div>

  <div class="mb-3">
    <select
      class="form-control"
      [value]="category()"
      (change)="onCategoryChange($event)"
    >
      <option value="">All</option>
      @for (c of categories; track c) {
        <option [value]="c">{{ c }}</option>
      }
    </select>
  </div>

  <section class="mb-3">
    <button class="btn btn-danger" (click)="reset()">Reset</button>
  </section>

  <ul class="list-group">
    @for (product of filteredProducts(); track product.name) {
      <li class="list-group-item">
        {{ product.name }} <small class="text-muted">({{ product.category }})</small>
      </li>
    } @empty {
      <li class="list-group-item text-muted">No products found.</li>
    }
  </ul>
</div>
